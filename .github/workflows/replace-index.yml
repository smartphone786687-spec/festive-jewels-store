name: Replace index with hybrid signin
on: workflow_dispatch
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv festive-jewels-store-github-pages.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with hybrid sign-in"
          git push
